<header class="header">
  <div class="content">
    <a class="home" routerLink="/" aria-label="Bühler – line overview">
      <img class="logo" src="buhler-logo.svg" alt="" />
    </a>

    <div class="info">
      <span class="info-item">
        <app-icon name="schedule" />
        <app-clock />
      </span>
      @if (user(); as user) {
        <span class="info-item">
          <app-icon name="account_circle" />
          <span>{{ user.name }}</span>
        </span>
      }
    </div>
  </div>
</header>
